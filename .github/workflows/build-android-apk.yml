name: Build MaTrip Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload installable test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaTrip-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable test APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: matrip-test-${{ github.run_number }}
          name: MaTrip Test APK #${{ github.run_number }}
          body: |
            MaTrip personal test APK.
            Install this debug APK on an Android device for personal testing.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
