name: Build MaTrip Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure stable signing key (if repository secrets are configured)
        env:
          MATRIP_KEYSTORE_BASE64: ${{ secrets.MATRIP_KEYSTORE_BASE64 }}
          MATRIP_KEYSTORE_PASSWORD: ${{ secrets.MATRIP_KEYSTORE_PASSWORD }}
          MATRIP_KEY_ALIAS: ${{ secrets.MATRIP_KEY_ALIAS }}
          MATRIP_KEY_PASSWORD: ${{ secrets.MATRIP_KEY_PASSWORD }}
        run: |
          if [ -z "$MATRIP_KEYSTORE_BASE64" ] || [ -z "$MATRIP_KEYSTORE_PASSWORD" ] || [ -z "$MATRIP_KEY_ALIAS" ] || [ -z "$MATRIP_KEY_PASSWORD" ]; then
            echo "::error::Stable APK signing is not configured. Add the four MATRIP_* repository Actions secrets before building. Do not publish APKs signed with a temporary key; they cannot reliably update an installed version."
            exit 1
          fi
          echo "$MATRIP_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/app/matrip-release.keystore"
          echo "MATRIP_KEYSTORE_PATH=$GITHUB_WORKSPACE/app/matrip-release.keystore" >> "$GITHUB_ENV"
          echo "MATRIP_KEYSTORE_PASSWORD=$MATRIP_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MATRIP_KEY_ALIAS=$MATRIP_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MATRIP_KEY_PASSWORD=$MATRIP_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload installable test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaTrip-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable test APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: matrip-test-${{ github.run_number }}
          name: MaTrip Test APK #${{ github.run_number }}
          body: |
            MaTrip personal test APK.
            Install this debug APK on an Android device for personal testing.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
